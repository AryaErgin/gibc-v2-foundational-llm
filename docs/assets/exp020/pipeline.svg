<text x="883" y="211.6" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#152c40">7,199,981,568 prediction tokens</text>
<text x="883" y="239.2" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#152c40">Fresh seed 42 · AdamW · cosine</text>
