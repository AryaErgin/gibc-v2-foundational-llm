<text x="70" y="602.6" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#152c40">HellaSwag · ARC-Easy · PIQA · WinoGrande · separate held-out WikiText-103 token PPL</text>
<text x="48" y="665.6" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#53687a">Historical benchmark exposure and public-text exclusion screening are disclosed; final selection precedes its scoring.</text>
<text x="48" y="699.0" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#53687a">Sources: frozen config; corpus manifest; training summary; preregistration; completed official task metadata.</text>
