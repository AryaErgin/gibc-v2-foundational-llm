<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img">
<title>Short-run winners changed at longer horizons</title>
<rect width="1800" height="1200" fill="#F5F3ED"/>
<text x="90.000" y="109.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700">EXP-020  /  GIBC TRACK 01</text>
<text x="1432.008" y="109.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400">FINAL LANGUAGE MODEL</text>
<text x="90.000" y="248.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="74" font-weight="700">Short-run winners changed</text>
<text x="90.000" y="348.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="74" font-weight="700">at longer horizons.</text>
<text x="90.000" y="422.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="32" font-weight="400">We tested what survived longer training in this sub-50M regime.</text>
<text x="90.000" y="555.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="41" font-weight="700">WSD</text>
<text x="90.000" y="641.000" fill="#126B63" font-family="Segoe UI, sans-serif" font-size="36" font-weight="700">Replicated advantage</text>
<text x="90.000" y="695.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="26" font-weight="400">300M tokens / two seeds</text>
<line x1="100" y1="733" x2="100" y2="792" stroke="#126B63" stroke-width="4"/>
<line x1="100" y1="792" x2="93.28804245954116" y2="779.7138441335347" stroke="#126B63" stroke-width="4"/>
<line x1="100" y1="792" x2="106.71195754045884" y2="779.7138441335347" stroke="#126B63" stroke-width="4"/>
<text x="90.000" y="853.000" fill="#A44B38" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Advantage did not survive</text>
<text x="90.000" y="909.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="26" font-weight="400">2.4B tokens / worse than cosine</text>
<text x="645.000" y="555.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="41" font-weight="700">QK-Norm</text>
<text x="645.000" y="641.000" fill="#126B63" font-family="Segoe UI, sans-serif" font-size="36" font-weight="700">Improved at 1.5B</text>
<text x="645.000" y="695.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="26" font-weight="400">−0.01216 validation NLL</text>
<line x1="655" y1="733" x2="655" y2="792" stroke="#126B63" stroke-width="4"/>
<line x1="655" y1="792" x2="648.2880424595412" y2="779.7138441335347" stroke="#126B63" stroke-width="4"/>
<line x1="655" y1="792" x2="661.7119575404588" y2="779.7138441335347" stroke="#126B63" stroke-width="4"/>
<text x="645.000" y="853.000" fill="#A44B38" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Too small to include</text>
<text x="645.000" y="909.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="26" font-weight="400">Required improvement: 0.015 NLL</text>
<text x="1200.000" y="550.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="36" font-weight="700">Cautious Weight Decay</text>
<text x="1200.000" y="641.000" fill="#126B63" font-family="Segoe UI, sans-serif" font-size="36" font-weight="700">Intermediate advantage</text>
<text x="1200.000" y="695.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="26" font-weight="400">Ahead at pre-terminal checkpoints</text>
<line x1="1210" y1="733" x2="1210" y2="792" stroke="#126B63" stroke-width="4"/>
<line x1="1210" y1="792" x2="1203.2880424595412" y2="779.7138441335347" stroke="#126B63" stroke-width="4"/>
<line x1="1210" y1="792" x2="1216.7119575404588" y2="779.7138441335347" stroke="#126B63" stroke-width="4"/>
<text x="1200.000" y="853.000" fill="#A44B38" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Reversed by the endpoint</text>
<text x="1200.000" y="909.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="26" font-weight="400">1.5B / +0.00627 NLL vs control</text>
<rect x="90" y="986" width="1620" height="86" fill="#192C2B"/>
<text x="120.000" y="1047.000" fill="#F5F3ED" font-family="Segoe UI, sans-serif" font-size="47" font-weight="700">Final decision: keep the simpler cosine Recipe-v3.</text>
<text x="90.000" y="1106.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="26" font-weight="400">Matched internal validation. Preregistered decisions. Negative results preserved.</text>
</svg>
