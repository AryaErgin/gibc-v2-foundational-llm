<text x="90.000" y="585.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="35" font-weight="700">FineWeb + FineWeb-Edu</text>
<text x="90.000" y="644.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="30" font-weight="400">2:1 target mixture</text>
