<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img">
<title>Screened data, controlled selection and independent official reporting</title>
<rect width="1800" height="1200" fill="#F5F3ED"/>
<text x="90.000" y="109.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700">EXP-020  /  GIBC TRACK 01</text>
<text x="1432.008" y="109.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="24" font-weight="400">FINAL LANGUAGE MODEL</text>
<text x="90.000" y="244.000" fill="#192C2B" font-family="Segoe UI, sans-serif" font-size="69" font-weight="700">One pipeline. Separate decisions.</text>
<text x="90.000" y="314.000" fill="#126B63" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Data screening protects training. Internal validation selects the model.</text>
<text x="90.000" y="372.000" fill="#126B63" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Official benchmarks report the frozen model’s performance.</text>
<text x="90.000" y="493.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700">DATA</text>
<text x="645.000" y="493.000" fill="#62716D" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700">TRAINING &amp; SELECTION</text>
